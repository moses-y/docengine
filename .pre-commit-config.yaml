# Install once: pip install pre-commit && pre-commit install
# Runs on every `git commit`; `pre-commit run --all-files` runs it on demand.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (backend lint)
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        name: ruff (backend format)
        files: ^backend/

  - repo: local
    hooks:
      - id: backend-tests
        name: backend unit tests (pytest, excludes integration/)
        entry: bash -c 'cd backend && PYTHONPATH=. python -m pytest --ignore=tests/integration -q'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: frontend-typecheck
        name: frontend typecheck (tsc --noEmit)
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx)$
