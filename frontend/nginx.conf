server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Optional reverse proxy for the API, generated at container start by
    # docker-entrypoint.d/40-api-proxy.sh from $API_UPSTREAM. Under docker
    # compose that variable points at the `api` service, so the frontend can
    # keep using relative `/api` URLs and needs no CORS. On a platform like
    # Railway, where each service gets its own domain, $API_UPSTREAM is unset
    # and this include is empty -- the bundle is built with an absolute
    # VITE_API_BASE_URL instead. Generating the block rather than hardcoding
    # it matters because nginx resolves proxy_pass hostnames at config load
    # and refuses to start if the name does not exist.
    include /etc/nginx/conf.d/api_proxy.inc;

    location / {
        try_files $uri /index.html;
    }
}
