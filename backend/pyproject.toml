[project]
name = "docengine-api"
version = "1.0.0"
description = "DocEngine backend: FastAPI + SQLAlchemy async + PostgreSQL"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "python-magic>=0.4.27",
    "mammoth>=1.8",
    "markdown-it-py>=3.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "EXE002", # file-mode bit is unreliable across filesystems/CI checkouts
    "B008",   # FastAPI's `Depends(...)` in a default arg is the idiomatic pattern
    "UP042",  # `str, Enum` (not `enum.StrEnum`) keeps JSON/`.value` behavior explicit
    "UP017",  # `datetime.UTC` alias is 3.11+; `timezone.utc` runs on 3.10 too
]

[tool.ruff.lint.per-file-ignores]
# Deliberate catch-all: a failed hash/verify must never raise past auth,
# and get_db's handler re-raises after rollback rather than swallowing.
"app/security.py" = ["BLE001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
